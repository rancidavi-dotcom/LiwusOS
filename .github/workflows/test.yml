name: LiwusOS Tests

on:
  push:
    branches: [ main, master, develop, lean-kernel ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc binutils make \
            grub-pc-bin grub-common \
            xorriso mtools \
            qemu-system-x86

      - name: Build kernel and ISO
        run: make -j"$(nproc)" all

      - name: In-kernel tests
        timeout-minutes: 8
        run: make test

      - name: Ring-3 integration tests
        timeout-minutes: 8
        run: make ring3-test

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-serial-log
          path: test_serial.log
          retention-days: 30
