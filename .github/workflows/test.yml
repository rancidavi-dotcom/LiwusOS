name: LiwusOS Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc nasm \
            grub-pc-bin grub-common \
            xorriso mtools \
            qemu-system-x86 \
            make

      - name: Build kernel
        run: make -j$(nproc) kernel.bin

      - name: Build userspace test runner
        run: make -j$(nproc) tests/test_runner.elf

      - name: Build ISO
        run: make liwusos.iso

      - name: Run SDFS tests
        timeout-minutes: 2
        run: make test-sdfs

      - name: Run userspace tests
        timeout-minutes: 2
        run: make test-user

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-serial-log
          path: test_serial.log
          retention-days: 30
