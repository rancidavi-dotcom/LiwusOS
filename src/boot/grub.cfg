set timeout=5
set default=0

# Modo texto puro - gfxpayload=text usa VGA 80x25 (0xB8000)
# A mensagem "error: no suitable video mode found" é do GRUB UEFI
# tentando modo gráfico antes de cair para texto. É inofensiva.
terminal_output console

menuentry "LiwusOS x86_64 (modo texto)" {
	set gfxpayload=text
	multiboot2 /boot/kernel.bin
	module2 /boot/initrd.tar
}