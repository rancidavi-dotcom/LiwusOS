set timeout=5
set default=0

# O kernel oferece um console textual em framebuffer quando disponível.
insmod all_video
terminal_output console

menuentry "LiwusOS x86_64 (modo texto)" {
	if [ "$grub_platform" = "efi" ]; then
		set gfxpayload=800x600x32
	else
		set gfxpayload=text
	fi
	multiboot2 /boot/kernel.bin
	module2 /boot/initrd.tar
}
