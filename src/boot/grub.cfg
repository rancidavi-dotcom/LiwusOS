set timeout=3
set default=0

# Modulos de video conforme a plataforma (evita erros no UEFI)
if [ x$grub_platform = xefi ]; then
    insmod efi_gop
else
    insmod vbe
    insmod vga
fi
insmod all_video
insmod font
insmod gfxterm

set gfxmode=1366x768x32,1366x768,1360x768x32,1360x768,1280x720x32,1280x720,1920x1080x32,1920x1080,1024x768x32,1024x768,auto
set gfxpayload=keep
terminal_output gfxterm

menuentry "LiwusOS x86_64 (Live USB / Modo Grafico)" {
	set gfxpayload=1366x768x32,1366x768,1360x768x32,1360x768,1280x720x32,1280x720,1920x1080x32,1920x1080,1024x768x32,1024x768,keep,auto
	search --no-floppy --file --set=root /boot/kernel.bin
	multiboot2 /boot/kernel.bin mode=live kbd=abnt2
	module2 /boot/initrd.tar
}

menuentry "LiwusOS x86_64 (Modo Seguro - VESA 1024x768)" {
	set gfxpayload=1024x768x32,1024x768,keep,auto
	search --no-floppy --file --set=root /boot/kernel.bin
	multiboot2 /boot/kernel.bin mode=live kbd=abnt2
	module2 /boot/initrd.tar
}

