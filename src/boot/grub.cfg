set timeout=2
set default=0

insmod all_video
insmod gfxterm
insmod vbe
insmod vga

# Prefer a wide framebuffer so responsive websites reach their desktop
# breakpoints on capable displays; GRUB falls back through the listed modes.
set gfxmode=1920x1080x32,1600x900x32,1366x768x32,1024x768x32,800x600x32,auto

menuentry "LiwusOS x86_64 (Live USB / Modo Grafico)" {
	set gfxpayload=keep
	search --no-floppy --file --set=root /boot/kernel.bin
	multiboot2 /boot/kernel.bin mode=live kbd=abnt2
	module2 /boot/initrd.tar
}

menuentry "LiwusOS x86_64 (Live USB / Modo Texto)" {
	set gfxpayload=text
	search --no-floppy --file --set=root /boot/kernel.bin
	multiboot2 /boot/kernel.bin mode=live mode=text kbd=abnt2
	module2 /boot/initrd.tar
}

menuentry "LiwusOS x86_64 (Live USB / Modo Grafico / Teclado US)" {
	set gfxpayload=keep
	search --no-floppy --file --set=root /boot/kernel.bin
	multiboot2 /boot/kernel.bin mode=live kbd=us
	module2 /boot/initrd.tar
}

menuentry "LiwusOS x86_64 (Live USB / Modo Texto / Teclado US)" {
	set gfxpayload=text
	search --no-floppy --file --set=root /boot/kernel.bin
	multiboot2 /boot/kernel.bin mode=live mode=text kbd=us
	module2 /boot/initrd.tar
}
