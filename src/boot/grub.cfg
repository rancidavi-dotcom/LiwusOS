set timeout=5
set default=0

insmod all_video
set gfxmode=auto
set gfxpayload=keep

menuentry "LiwusOS x86_64 (grafico)" {
	multiboot2 /boot/kernel.bin
	module2 /boot/initrd.tar
}

# Diagnóstico/fallback para firmwares cujo VBE/GOP não aceita o modo gráfico.
# O kernel continua inicializando, mas deixa o VGA texto visível.
menuentry "LiwusOS x86_64 (modo texto seguro)" {
	set gfxpayload=text
	multiboot2 /boot/kernel.bin
	module2 /boot/initrd.tar
}
